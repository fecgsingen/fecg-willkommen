<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bauchbinde</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* OBS-Dock (Ansicht → Docks → Benutzerdefinierte Browser-Docks). Muss vom selben Ursprung kommen wie szenen.html. */
:root { --navy0: #0a0d17; --karte: #141b31; --text: #fff; --leise: #8a93ad; --linie: rgba(195,201,218,.16); --cyan: #3bb2e0; --rot: #e86a5a; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; background: var(--navy0); color: var(--text); font: 500 14px/1.4 system-ui, "Segoe UI", sans-serif; }
h1 { margin: 0 0 10px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--leise); }
.zeile { display: flex; gap: 6px; margin-bottom: 6px; }
input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--linie); background: var(--karte); color: var(--text); font: inherit; }
input[type=number] { flex: 0 0 64px; }
button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--linie); background: var(--karte); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
button.an { background: var(--cyan); border-color: var(--cyan); color: #04121a; }
button.aus { border-color: var(--rot); color: var(--rot); }
.liste { display: grid; gap: 6px; margin-top: 12px; }
.liste button { text-align: left; font-weight: 500; }
.liste small { color: var(--leise); margin-left: 6px; }
</style>
</head>
<body>
<h1>Bauchbinde</h1>
<div class="zeile"><input id="name" placeholder="Name, z. B. Johannes Schmidt"></div>
<div class="zeile"><input id="rolle" placeholder="Rolle, z. B. Predigt · Johannes 1"><input id="dauer" type="number" min="0" value="8" title="Sekunden, 0 = bleibt stehen"></div>
<div class="zeile"><button class="an" id="zeigen">Einblenden</button><button class="aus" id="aus">Ausblenden</button><button id="merken">Merken</button></div>
<div class="liste" id="liste"></div>
<script>
const $ = (id) => document.getElementById(id);
let kanal; try { kanal = new BroadcastChannel('fecg-stream'); } catch {}
function senden(b) {
  b.zeit = Date.now();
  kanal?.postMessage(b);
  try { localStorage.setItem('fecg-stream', JSON.stringify(b)); } catch {}
}
const aktuell = () => ({ name: $('name').value.trim(), rolle: $('rolle').value.trim(), dauer: Number($('dauer').value) || 0 });
$('zeigen').onclick = () => senden({ typ: 'zeigen', ...aktuell() });
$('aus').onclick = () => senden({ typ: 'aus' });

// gemerkte Einträge (Prediger, Moderation …) bleiben im Dock gespeichert
const laden = () => { try { return JSON.parse(localStorage.getItem('fecg-stream-liste')) || []; } catch { return []; } };
const sichern = (l) => { try { localStorage.setItem('fecg-stream-liste', JSON.stringify(l)); } catch {} };
function zeichnen() {
  const box = $('liste'); box.textContent = '';
  laden().forEach((e, i) => {
    const b = document.createElement('button');
    b.innerHTML = '';
    b.append(e.name); const s = document.createElement('small'); s.textContent = e.rolle; b.append(s);
    b.onclick = () => { $('name').value = e.name; $('rolle').value = e.rolle; senden({ typ: 'zeigen', ...aktuell() }); };
    b.oncontextmenu = (ev) => { ev.preventDefault(); const l = laden(); l.splice(i, 1); sichern(l); zeichnen(); };
    b.title = 'Klick: einblenden · Rechtsklick: löschen';
    box.append(b);
  });
}
$('merken').onclick = () => { const a = aktuell(); if (!a.name) return; const l = laden().filter((e) => e.name !== a.name || e.rolle !== a.rolle); l.unshift({ name: a.name, rolle: a.rolle }); sichern(l.slice(0, 12)); zeichnen(); };
zeichnen();
</script>
</body>
</html>
