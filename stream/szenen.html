:root {
  --navy0: #0a0d17; --navy1: #1d2848;
  --text: #fff; --muted: #c3c9da; --leise: #8a93ad;
  --rot: #e86a5a; --cyan: #3bb2e0; --gruen: #46c85a; --gelb: #d6d446; --blau: #5a8ce6; --lila: #aa5adc;
  --regenbogen: linear-gradient(90deg, var(--rot) 0 16.66%, var(--cyan) 16.66% 33.33%, var(--gruen) 33.33% 50%, var(--gelb) 50% 66.66%, var(--blau) 66.66% 83.33%, var(--lila) 83.33%);
  --schrift: "InterFECG", "Inter", system-ui, "Segoe UI", sans-serif;
  /* kein color-scheme: dark, sonst malt OBS den Hintergrund grau statt durchsichtig (14.11.2026) */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font: 500 16px/1.4 var(--schrift); color: var(--text); -webkit-font-smoothing: antialiased; }

/* feste 1920×1080-Bühne, auf jede Fenstergröße skaliert */
#buehne { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.szene { position: absolute; inset: 0; display: none; }
body[data-szene="bauchbinde"] #s-bauchbinde, body[data-szene="ecke"] #s-ecke { display: block; }

/* ---------- Bauchbinde ---------- */
.binde { position: absolute; left: 110px; bottom: 120px; display: flex; align-items: stretch; filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); }
/* 14.11.2026: ohne .an/.aus ist nichts zu sehen (vorher blieb der dunkle Kasten der Würfel stehen) */
.binde { visibility: hidden; }
.binde.an, .binde.aus { visibility: visible; }
.binde .wuerfel { width: 108px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 14px; background: rgba(10,13,23,.88); border-radius: 14px 0 0 14px; align-content: center; }
.binde .wuerfel i { aspect-ratio: 1; border-radius: 3px; transform: scale(0); }
.binde .karte { position: relative; padding: 22px 46px 24px 34px; background: rgba(10,13,23,.82); backdrop-filter: blur(12px); border-radius: 0 14px 14px 0; clip-path: inset(0 100% 0 0); min-width: 420px; }
.binde .karte::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--regenbogen); border-radius: 0 0 14px 0; }
.binde .name { font-size: 46px; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; }
.binde .rolle { margin-top: 4px; font-size: 22px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.binde .rolle:empty { display: none; }
.binde.an .wuerfel i { animation: plopp .5s cubic-bezier(.3,1.6,.5,1) forwards; }
.binde.an .karte { animation: aufziehen .7s .35s cubic-bezier(.7,0,.2,1) forwards; }
.binde.aus .wuerfel i { transform: scale(1); animation: plopp .35s reverse ease-in forwards; animation-delay: calc(.25s + var(--d)) !important; }
.binde.aus .karte { clip-path: inset(0 0 0 0); animation: zuziehen .45s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes plopp { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
@keyframes aufziehen { to { clip-path: inset(0 0 0 0); } }
@keyframes zuziehen { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 100% 0 0); } }

/* ---------- Bauchbinde, ruhige Fassung (Standard, alte Fassung mit &design=1): eine Platte wie die Logo-Ecke, schmaler Farbstreifen links ---------- */
.binde.neu { left: 96px; bottom: 96px; filter: none; }
.binde.neu .wuerfel { display: none; }
.binde.neu .streifen { display: block; }
.binde .streifen { display: none; flex: none; width: 6px; border-radius: 3px; transform: scaleY(0); background: linear-gradient(180deg, var(--rot) 0 16.66%, var(--cyan) 16.66% 33.33%, var(--gruen) 33.33% 50%, var(--gelb) 50% 66.66%, var(--blau) 66.66% 83.33%, var(--lila) 83.33%); }
.binde.neu .karte { display: flex; align-items: stretch; gap: 24px; min-width: 0; padding: 20px 40px 22px 22px; border-radius: 18px; background: rgba(10,13,23,.86); backdrop-filter: none; box-shadow: 0 10px 30px rgba(0,0,0,.30); clip-path: none; opacity: 0; }
.binde.neu .karte::after { content: none; }
.binde.neu .text { overflow: hidden; }
.binde.neu .name { font-size: 44px; font-weight: 600; line-height: 1.15; letter-spacing: -.012em; }
.binde.neu .rolle { margin-top: 6px; font-size: 24px; font-weight: 500; line-height: 1.2; letter-spacing: .01em; text-transform: none; color: var(--muted); }
.binde.neu.an .karte { animation: nrein .6s cubic-bezier(.2,.7,.2,1) forwards; }
.binde.neu.an .streifen { animation: nstreif .6s .15s cubic-bezier(.2,.7,.2,1) forwards; }
.binde.neu.an .name, .binde.neu.an .rolle { animation: ntext .55s .22s cubic-bezier(.2,.7,.2,1) both; }
.binde.neu.an .rolle { animation-delay: .32s; }
.binde.neu.aus .karte { opacity: 1; clip-path: none; animation: nraus .4s cubic-bezier(.5,0,.8,.3) forwards; }
.binde.neu.aus .streifen { transform: scaleY(1); }
@keyframes nrein { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes nraus { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(12px); } }
@keyframes nstreif { to { transform: scaleY(1); } }
@keyframes ntext { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Ecke: kleines Logo + LIVE ---------- */
/* 14.11.2026: Logo und LIVE sitzen auf einer dunklen Platte, sonst ist das weiße „Singen“ auf hellem Bild nicht lesbar */
.ecke { position: absolute; right: 48px; top: 40px; display: flex; align-items: center; gap: 16px; padding: 12px 20px 12px 18px; border-radius: 18px; background: rgba(10,13,23,.8); box-shadow: 0 8px 26px rgba(0,0,0,.28); animation: auf 1s both; }
.ecke img { width: 124px; display: block; }
.live { display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; border-left: 1px solid rgba(195,201,218,.28); font-size: 18px; font-weight: 700; letter-spacing: .2em; }
.live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--rot); box-shadow: 0 0 0 0 rgba(232,106,90,.7); animation: puls 2s infinite; }
@keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(232,106,90,.7); } 70% { box-shadow: 0 0 0 12px rgba(232,106,90,0); } 100% { box-shadow: 0 0 0 0 rgba(232,106,90,0); } }

/* ---------- Fest-Varianten der Ecke (?fest=advent1…4 | weihnachten | karfreitag | ostern | himmelfahrt | pfingsten | erntedank, ohne Angabe normales Logo) ---------- */
.fest { width: 64px; height: 64px; flex: none; }
.fest:empty { display: none; }
.fest svg { width: 100%; height: 100%; overflow: visible; }
.festname { color: var(--muted); font-weight: 600; letter-spacing: .14em; padding-left: 12px; margin-left: 2px; border-left: 1px solid rgba(195,201,218,.3); }
.festname:empty { display: none; }
.flamme { transform-box: fill-box; transform-origin: 50% 100%; animation: flackern 1.6s ease-in-out infinite alternate; }
.flamme:nth-of-type(2n) { animation-duration: 1.3s; animation-delay: -.4s; }
@keyframes flackern { 0% { transform: scale(1, 1) rotate(-3deg); opacity: .95; } 50% { transform: scale(.92, 1.08) rotate(2deg); opacity: 1; } 100% { transform: scale(1.04, .94) rotate(-1deg); opacity: .9; } }
.leuchten { animation: leuchten 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes leuchten { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.05); } }
.drehen { animation: drehen 40s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes drehen { to { transform: rotate(360deg); } }
.wiegen { animation: wiegen 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes wiegen { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.steigen { animation: steigen 3s ease-in-out infinite; }
@keyframes steigen { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
.steigen:nth-of-type(2) { animation-delay: -1s; } .steigen:nth-of-type(3) { animation-delay: -2s; }

@media (prefers-reduced-motion: reduce) { .flamme, .leuchten, .drehen, .wiegen, .steigen { animation: none !important; } }
</style>

<script>
(() => {
  const p = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);

  document.body.dataset.szene = p.get('szene') || 'ecke';

  // Bühne auf Fenstergröße skalieren (OBS: 1920×1080 → Faktor 1)
  const buehne = $('buehne');
  const skalieren = () => { const f = Math.min(innerWidth / 1920, innerHeight / 1080); buehne.style.transform = `scale(${f})`; };
  addEventListener('resize', skalieren); skalieren();

  // ---------- Ecke ----------
  if (p.get('live') === '0') $('live').remove();
  if (['0', 'aus'].includes(p.get('logo'))) { document.querySelector('.ecke img').remove(); $('live').style.borderLeft = 'none'; $('live').style.paddingLeft = '0'; }

  // ---------- Fest-Variante ----------
  queueMicrotask(() => { // erst nach dem Rest des Skripts, FESTE steht weiter unten
    const fest = festFuer(p.get('fest'));
    if (fest) { $('fest').innerHTML = FESTE[fest.art](fest.n); if ($('festname') && p.get('festtext') !== '0') $('festname').textContent = fest.name; }
  });

  // ---------- Bauchbinde ----------
  // Steuerung: URL (?name=…&rolle=…&dauer=8) oder live aus steuerung.html (gleicher Ursprung: BroadcastChannel/localStorage).
  const binde = $('binde'), wuerfel = binde.querySelector('.wuerfel');
  for (let i = 0; i < 9; i++) {
    const w = document.createElement('i'); w.style.background = `var(${FARBEN[(i * 4) % 6]})`;
    const d = (i * 0.045).toFixed(3) + 's'; w.style.animationDelay = d; w.style.setProperty('--d', d);
    wuerfel.appendChild(w);
  }
  let timer, wegTimer;
  const BASIS = p.get('design') === '1' ? 'binde' : 'binde neu'; // ruhige Fassung ist Standard seit 14.11.2026, die alte mit Würfeln: &design=1 binde.className = BASIS;
  function zeigen(name, rolle, dauer) {
    clearTimeout(timer);
    $('b-name').textContent = name || ''; $('b-rolle').textContent = rolle || '';
    clearTimeout(wegTimer);
    binde.className = BASIS; void binde.offsetWidth; binde.className = BASIS + ' an';
    if (dauer > 0) timer = setTimeout(verstecken, dauer * 1000);
  }
  // nach dem Ausblenden die Klasse ganz wegnehmen: dann ist sicher nichts mehr zu sehen
  function verstecken() {
    clearTimeout(timer); if (!binde.classList.contains('an')) return;
    binde.className = BASIS + ' aus'; clearTimeout(wegTimer); wegTimer = setTimeout(() => { binde.className = BASIS; }, 1100);
  }
  function befehl(b) {
    if (!b) return;
    if (b.typ === 'zeigen') { document.body.dataset.szene = 'bauchbinde'; zeigen(b.name, b.rolle, b.dauer); }
    if (b.typ === 'aus') verstecken();
  }
  if (p.get('name')) {
    const start = () => zeigen(p.get('name'), p.get('rolle'), Number(p.get('dauer') ?? 8));
    // in OBS: bei jedem Aktivieren der Quelle neu einblenden
    window.addEventListener('obsSourceActiveChanged', (e) => e.detail.active ? start() : verstecken());
    setTimeout(start, 400);
  }
  else if (p.get('szene') === 'bauchbinde' && p.get('test') === '1') setTimeout(() => zeigen('Bauchbinde', 'Test · Name fehlt in der Adresse', 0), 400);
  try { new BroadcastChannel('fecg-stream').onmessage = (e) => befehl(e.data); } catch {}
  addEventListener('storage', (e) => { if (e.key === 'fecg-stream') try { befehl(JSON.parse(e.newValue)); } catch {} });
  addEventListener('message', (e) => befehl(e.data)); // für die Vorschau-Seite

  // Fest-Variante: nur von Hand über ?fest=… (keine Datumsautomatik, Lucien schaltet in OBS selbst um)
  function festFuer(wahl) {
    const NAMEN = { weihnachten: 'Weihnachten', karfreitag: 'Karfreitag', ostern: 'Ostern', himmelfahrt: 'Himmelfahrt', pfingsten: 'Pfingsten', erntedank: 'Erntedank' };
    const adv = /^advent([1-4])$/.exec(wahl || '');
    if (adv) return { art: 'advent', n: +adv[1], name: adv[1] + '. Advent' };
    if (NAMEN[wahl]) return { art: wahl, name: NAMEN[wahl] };
    return null;
  }
  const FESTE = {
    advent: (n) => `<svg viewBox="0 0 64 64">
      <ellipse cx="32" cy="50" rx="27" ry="8" fill="none" stroke="#2f7a45" stroke-width="7"/>
      <ellipse cx="32" cy="50" rx="27" ry="8" fill="none" stroke="#46c85a" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/>
      ${[12, 25, 39, 52].map((x, i) => `<rect x="${x - 3.5}" y="${30 + (i % 3 ? 2 : 0)}" width="7" height="${18 - (i % 3 ? 2 : 0)}" rx="1.5" fill="#e86a5a"/>` +
        (i < n ? `<path class="flamme" d="M${x} ${17 + (i % 3 ? 2 : 0)} c4 5 4 9 0 11 c-4 -2 -4 -6 0 -11z" fill="#ffcf5a"/>` : `<line x1="${x}" y1="${28 + (i % 3 ? 2 : 0)}" x2="${x}" y2="${30 + (i % 3 ? 2 : 0)}" stroke="#c3c9da" stroke-width="1.5"/>`)).join('')}
      <circle cx="32" cy="58" r="2.5" fill="#e86a5a"/><circle cx="18" cy="56" r="2" fill="#e86a5a"/><circle cx="46" cy="56" r="2" fill="#e86a5a"/></svg>`,
    weihnachten: () => `<svg viewBox="0 0 64 64">
      <circle class="leuchten" cx="32" cy="32" r="22" fill="rgba(255,214,110,.22)"/>
      <path class="drehen" d="M32 4 L36 26 L58 32 L36 38 L32 60 L28 38 L6 32 L28 26 Z" fill="#ffd66e"/>
      <path d="M32 18 L34 30 L46 32 L34 34 L32 46 L30 34 L18 32 L30 30 Z" fill="#fff6d6" transform="rotate(45 32 32)"/></svg>`,
    karfreitag: () => `<svg viewBox="0 0 64 64"><path d="M29 6h6v16h14v6H35v30h-6V28H15v-6h14z" fill="#8a93ad"/></svg>`,
    ostern: () => `<svg viewBox="0 0 64 64">
      <g class="drehen" opacity=".9">${Array.from({ length: 12 }, (_, i) => `<line x1="32" y1="30" x2="32" y2="2" stroke="#ffd66e" stroke-width="2" stroke-linecap="round" opacity=".55" transform="rotate(${i * 30} 32 30)"/>`).join('')}</g>
      <circle class="leuchten" cx="32" cy="30" r="15" fill="rgba(255,214,110,.35)"/>
      <path d="M29.5 12h5v12h10v5h-10v29h-5V29h-10v-5h10z" fill="#fff"/></svg>`,
    himmelfahrt: () => `<svg viewBox="0 0 64 64">
      <g fill="#ffd66e"><rect class="steigen" x="20" y="8" width="2.5" height="14" rx="1.2"/><rect class="steigen" x="31" y="2" width="2.5" height="18" rx="1.2"/><rect class="steigen" x="42" y="8" width="2.5" height="14" rx="1.2"/></g>
      <path d="M16 50a10 10 0 0 1 2-19.8A14 14 0 0 1 45 28a11 11 0 0 1 3 22z" fill="#eef2fb"/></svg>`,
    pfingsten: () => `<svg viewBox="0 0 64 64">
      <path class="flamme" d="M32 4c10 12 18 20 18 33a18 18 0 0 1-36 0c0-8 4-13 8-17 0 6 3 9 6 10-2-9 0-18 4-26z" fill="#e86a5a"/>
      <path class="flamme" d="M32 26c5 6 9 10 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z" fill="#ffcf5a"/></svg>`,
    erntedank: () => `<svg viewBox="0 0 64 64"><g class="wiegen">
      <path d="M32 62V14" stroke="#c9a640" stroke-width="2.5" stroke-linecap="round"/>
      ${[16, 24, 32, 40].map((y) => `<ellipse cx="27" cy="${y}" rx="4" ry="7" fill="#d6b44a" transform="rotate(-28 27 ${y})"/><ellipse cx="37" cy="${y}" rx="4" ry="7" fill="#d6b44a" transform="rotate(28 37 ${y})"/>`).join('')}
      <ellipse cx="32" cy="9" rx="3.5" ry="7" fill="#e3c35a"/></g>
      <path d="M14 58 q8 -10 14 -6" stroke="#46c85a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M50 58 q-8 -10 -14 -6" stroke="#46c85a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
})();
